<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="任务工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-precomposed.png">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<title>我的任务工作台</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* ===== 变量与重置 ===== */
:root{
  --sidebar-bg:#fff3f8;
  --sidebar-bg2:#ffe2ee;
  --primary:#f28bb5;
  --primary-hover:#e86f9f;
  --primary-light:#ffe5ef;
  --bg:#fff7fb;
  --card:#ffffff;
  --text:#6d3a4f;
  --text-secondary:#a66d82;
  --border:#ffd3e1;
  --success:#70c6a6;
  --success-light:#e4f8ef;
  --danger:#ef6f8f;
  --danger-light:#ffe2ea;
  --warning:#f5b75f;
  --warning-light:#fff1d5;
  --blue:#84a9f4;
  --blue-light:#e7efff;
  --radius:22px;
  --radius-sm:16px;
  --shadow:0 6px 18px rgba(242,139,181,.14);
  --shadow-lg:0 14px 34px rgba(242,139,181,.22);
  --sidebar-w:260px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;font-size:14px;color:var(--text);background:radial-gradient(circle at 20% 10%,#ffe4ef 0,#fff7fb 26%,#f7fff8 62%,#fff7fb 100%)}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
a{text-decoration:none;color:inherit}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;overflow:hidden}

/* ===== 侧边栏 ===== */
.sidebar{
  flex-shrink:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg2) 100%);
  display:flex;flex-direction:column;
  height:100vh;overflow-y:auto;
  border-right:1px solid rgba(242,139,181,.28);
}
.sidebar-logo{padding:28px 24px 20px}
.sidebar-logo h1{color:#d85d92;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sidebar-logo p{color:#b7798e;font-size:12px;margin-top:4px}
.sidebar-nav{flex:1;padding:8px 12px}
.menu-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:var(--radius-sm);
  color:#9d6078;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
  margin-bottom:4px;position:relative;
}
.menu-item:hover{background:rgba(255,255,255,.7);color:#d85d92}
.menu-item.active{background:#fff;color:#d85d92;box-shadow:var(--shadow)}
.menu-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.menu-item .icon{font-size:18px;width:24px;text-align:center}
.menu-item .badge{
  margin-left:auto;background:var(--primary);color:#fff;
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;min-width:20px;text-align:center;
}
.menu-item .badge.income{background:var(--success)}
.sidebar-footer{padding:16px 24px;border-top:1px dashed rgba(242,139,181,.35);color:#9d6078;font-size:12px}

/* ===== 主内容区 ===== */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:32px 40px}
.main-inner{width:100%;max-width:1100px;margin:0 auto}
.view{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== 页面头部 ===== */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.page-head h1{font-size:24px;font-weight:700}
.page-head .subtitle{color:var(--text-secondary);font-size:14px;margin-top:4px}

/* ===== 今日计划头部 ===== */
.today-hero{
  background:linear-gradient(135deg,#ffd7e7 0%,#fff1f7 55%,#e9fff5 100%);
  border-radius:var(--radius);padding:28px 32px;color:#fff;margin-bottom:24px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
  color:#bf4f80;border:1px solid rgba(255,255,255,.85);position:relative;overflow:hidden;
}
.today-hero::after{content:'♡';position:absolute;right:24px;bottom:-8px;font-size:78px;color:rgba(242,139,181,.18);font-weight:900;pointer-events:none;z-index:0}
.today-hero>*{position:relative;z-index:1}
.today-hero h1{font-size:26px;font-weight:700}
.today-hero .date{opacity:.85;font-size:14px;margin-top:6px}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;transition:all .2s;
  position:relative;z-index:2;touch-action:manipulation;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--danger-light);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-ghost{background:transparent;color:var(--text-secondary);padding:6px 10px;border-radius:6px}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-white{background:#fff;color:#d85d92;backdrop-filter:blur(4px);box-shadow:var(--shadow)}
.btn-white:hover{background:#fff6fa}

/* ===== 统计卡片 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
}
.stat-card .stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-card .stat-info .stat-val{font-size:22px;font-weight:700;line-height:1.2}
.stat-card .stat-info .stat-label{font-size:12px;color:var(--text-secondary);margin-top:2px}
.bg-blue{background:var(--blue-light);color:var(--blue)}
.bg-green{background:var(--success-light);color:var(--success)}
.bg-orange{background:var(--warning-light);color:var(--warning)}
.bg-red{background:var(--danger-light);color:var(--danger)}

/* ===== 筛选条 ===== */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{
  padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;
  background:#fff;border:1px solid var(--border);color:var(--text-secondary);transition:all .2s;
}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== 任务列表 ===== */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border-radius:var(--radius-sm);padding:14px 18px;
  box-shadow:var(--shadow);transition:all .2s;border-left:3px solid transparent;
}
.task-item:hover{box-shadow:var(--shadow-lg);transform:translateX(2px)}
.task-item.overdue{border-left-color:var(--danger)}
.task-item.today-task{border-left-color:var(--primary)}
.task-item.upcoming{border-left-color:var(--warning)}
.task-item.completed{opacity:.55}
.task-item.completed .task-title{text-decoration:line-through;color:var(--text-secondary)}
.task-date-card{min-width:92px;text-align:center;background:#fff5fa;border:1px solid var(--border);border-radius:18px;padding:10px 8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}
.task-date-main{font-size:18px;font-weight:900;color:#d85d92;line-height:1.2}
.task-date-sub{font-size:12px;color:#9d6078;margin-top:3px;font-weight:700}
.task-work-line{font-size:18px;font-weight:900;color:#6d3a4f;line-height:1.35;word-break:break-word}
.task-time{display:inline-flex;align-items:center;gap:4px;color:#d85d92;font-weight:900;margin-right:4px}
.task-content{font-weight:900}

.task-check{
  width:22px;height:22px;border:2px solid var(--border);border-radius:6px;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .2s;background:#fff;
}
.task-check:hover{border-color:var(--success)}
.task-item.completed .task-check{background:var(--success);border-color:var(--success);color:#fff}
.task-check svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.task-item.completed .task-check svg{opacity:1}

.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;word-break:break-word}
.task-meta{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.task-deadline{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px}
.task-deadline.overdue-text{color:var(--danger);font-weight:600}
.task-deadline.today-text{color:var(--primary);font-weight:600}
.task-deadline.completed-text{color:var(--success);font-weight:600}

.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-green{background:var(--success-light);color:var(--success)}
.badge-orange{background:var(--warning-light);color:var(--warning)}

.task-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.task-item:hover .task-actions{opacity:1}
.icon-btn{
  width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-secondary);transition:all .2s;font-size:14px;
}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-light);color:var(--danger)}

/* ===== 卡片网格 ===== */
.section{margin-bottom:32px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-head h2{font-size:17px;font-weight:700}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.file-card,.course-card,.folder-card,.income-card{
  background:var(--card);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);transition:all .2s;cursor:pointer;position:relative;
  display:flex;flex-direction:column;gap:10px;
}
.file-card:hover,.folder-card:hover,.income-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.course-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card-top{display:flex;align-items:flex-start;gap:12px}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card-icon.bg-indigo{background:var(--primary-light);color:var(--primary)}
.card-icon.bg-teal{background:#ccfbf1;color:#0d9488}
.card-icon.bg-pink{background:#fce7f3;color:#db2777}
.card-icon.bg-amber{background:var(--warning-light);color:var(--warning)}
.card-name{font-size:14px;font-weight:600;word-break:break-word}
.card-desc{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.card-meta{font-size:12px;color:var(--text-secondary)}
.card-actions{display:flex;gap:4px}
.course-link-icon{color:var(--primary);font-size:14px}

/* ===== 文件夹卡片 ===== */
.folder-card .folder-count{font-size:12px;color:var(--text-secondary);background:var(--bg);padding:2px 10px;border-radius:10px}

/* ===== 详情页 ===== */
.btn-back{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  background:#fff;border:1px solid var(--border);color:var(--text-secondary);margin-bottom:16px;transition:all .2s;
}
.btn-back:hover{border-color:var(--primary);color:var(--primary)}
.detail-head{background:var(--card);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);margin-bottom:24px}
.detail-head h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.detail-head .tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ===== 收入 ===== */
.income-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.income-chart-box{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
.income-chart-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:12px;height:160px;padding-bottom:28px;position:relative}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.chart-bar-fill{width:100%;max-width:40px;background:linear-gradient(180deg,var(--primary),#818cf8);border-radius:6px 6px 0 0;transition:all .3s;min-height:4px}
.chart-bar:hover .chart-bar-fill{background:linear-gradient(180deg,var(--primary-hover),var(--primary))}
.chart-bar-label{position:absolute;bottom:-22px;font-size:11px;color:var(--text-secondary)}
.chart-bar-val{position:absolute;top:-20px;font-size:11px;font-weight:600;color:var(--primary);opacity:0;transition:opacity .2s}
.chart-bar:hover .chart-bar-val{opacity:1}

.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:14px 18px;font-size:13px;font-weight:600;color:var(--text-secondary);background:var(--bg);border-bottom:1px solid var(--border)}
td{padding:14px 18px;font-size:14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.amount{font-weight:700;color:var(--success)}
.balance-card{background:linear-gradient(135deg,#7b3f72 0%,#4b2f5d 100%);border-radius:28px;padding:26px 28px;color:#fff;box-shadow:0 14px 32px rgba(94,52,105,.26);margin-bottom:18px;position:relative;overflow:hidden}
.balance-card::after{content:'';position:absolute;right:-28px;top:-24px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.balance-label{font-size:14px;opacity:.85;margin-bottom:8px}
.balance-val{font-size:42px;font-weight:900;line-height:1}
.balance-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.balance-mini-label{font-size:13px;opacity:.76}
.balance-mini-val{font-size:18px;font-weight:900;margin-top:4px}
.budget-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.budget-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:12px}
.budget-unset{color:#60b783;font-size:13px}
.budget-bar{height:8px;background:#ffe3ed;border-radius:999px;overflow:hidden;margin-bottom:8px}
.budget-used{height:100%;width:0;background:linear-gradient(90deg,#f28bb5,#70c6a6);border-radius:999px}
.money-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.money-action{border-radius:24px;padding:18px;font-size:18px;font-weight:900;text-align:center;box-shadow:var(--shadow)}
.money-action.expense{background:#ffd1d5;color:#d85d75}
.money-action.income{background:#d8f8df;color:#489b68}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.quick-item{background:#fff;border:1px solid var(--border);border-radius:20px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.quick-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.quick-icon{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff1f7}
.quick-name{font-size:13px;font-weight:800;color:#8f4d67}

/* ===== Kitty 风装饰与推荐卡片 ===== */
.kitty-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);color:#d85d92;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.kitty-icon{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:50%;box-shadow:var(--shadow);font-size:15px}
.recommend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.recommend-card{background:linear-gradient(180deg,#fff,#fff7fb);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:all .2s}
.recommend-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.recommend-type{display:inline-flex;width:max-content;align-items:center;gap:5px;background:var(--primary-light);color:#d85d92;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.recommend-title{font-weight:800;line-height:1.45}
.recommend-desc{font-size:12px;color:var(--text-secondary);line-height:1.6}
.recommend-link{margin-top:auto;color:#d85d92;font-weight:800;font-size:13px}
.recommend-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.fav-btn{background:#fff;border:1px solid var(--border);color:#d85d92;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s;white-space:nowrap}
.fav-btn:hover{background:#fff0f6;border-color:var(--primary)}

/* ===== 日历 ===== */
.calendar-box{width:100%;max-width:100%;overflow:hidden;background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-top:24px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.calendar-head h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.calendar-month-label{text-align:center;font-size:13px;font-weight:700;color:#d85d92;margin-bottom:12px}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav-btn{background:#fff;border:1px solid #ffe0eb;color:#d85d92;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.cal-nav-btn:hover{background:#fff0f6;border-color:var(--primary)}
.cal-nav-btn.cur{background:var(--primary);color:#fff;border-color:var(--primary)}
.calendar-grid{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.calendar-week{font-size:12px;text-align:center;color:#b7798e;font-weight:800;padding:4px 0}
.calendar-day{min-width:0;overflow:hidden;min-height:78px;background:#fff;border:1px solid #ffe0eb;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:all .2s}
.calendar-day:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.calendar-day.muted{opacity:.35;cursor:default}
.calendar-day.today{border-color:var(--primary);box-shadow:0 0 0 3px rgba(242,139,181,.12)}
.calendar-date{font-weight:800;color:#8f4d67}
.calendar-dot{max-width:100%;font-size:11px;line-height:1.35;border-radius:999px;padding:2px 7px;background:#fff0f6;color:#d85d92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-dot.money{background:#e4f8ef;color:#3a9f79}
.calendar-more{font-size:11px;color:#b7798e}

/* ===== 上传文件 ===== */
.upload-note{font-size:12px;color:var(--text-secondary);line-height:1.6;background:#fff7fb;border:1px dashed var(--border);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.file-meta{font-size:12px;color:var(--text-secondary);line-height:1.5}
.file-open{display:inline-flex;align-items:center;gap:6px;color:#d85d92;font-weight:800}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:48px 20px;color:var(--text-secondary)}
.empty .empty-icon{font-size:48px;margin-bottom:12px}
.empty .empty-text{font-size:14px}

/* ===== 弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;
}
.modal-overlay.active{display:flex;animation:fadeIn .2s ease}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;
  overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .25s ease;
}
@keyframes modalIn{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-secondary);transition:all .2s}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:24px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}

/* ===== 表单 ===== */
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;transition:all .2s;background:#fff;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.form-group textarea{resize:vertical;line-height:1.6}
.form-group select{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ===== 查看内容 ===== */
.view-content{padding:4px 0;font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;min-height:60px}
.view-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}

/* ===== 支出日历标签 ===== */
.calendar-dot.expense{background:#fee2e2;color:#dc2626}

/* ===== 语音口述 ===== */
.voice-area-wrap{display:flex;gap:8px;align-items:flex-start}
.voice-area-wrap textarea{flex:1}
.voice-btn{white-space:nowrap;flex-shrink:0;background:#f3e8ff;color:#7c3aed;border:1px solid #d8b4fe}
.voice-btn:hover{background:#e9d5ff}
.voice-btn.recording{background:#ef4444;color:#fff;border-color:#ef4444;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* ===== 面试复盘展示 ===== */
.review-section{margin-bottom:16px;padding:14px;background:#fafafa;border-radius:var(--radius-sm);border:1px solid var(--border)}
.review-label{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px}
.review-content{font-size:14px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}

/* ===== 数据管理 ===== */
.dm-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.dm-section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dm-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
.dm-info-row:last-child{border-bottom:none}
.dm-info-label{color:var(--text-secondary)}
.dm-info-value{font-weight:600;color:var(--text)}
.dm-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.dm-tip{font-size:13px;color:var(--text-secondary);margin-top:12px;line-height:1.6;background:#fff5fa;padding:12px;border-radius:var(--radius-sm)}
.dm-status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.dm-status-on{background:var(--success-light);color:var(--success)}
.dm-status-off{background:var(--warning-light);color:var(--warning)}
.dm-hidden-input{display:none}

/* ===== Toast ===== */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--sidebar-bg);color:#fff;padding:12px 24px;border-radius:var(--radius-sm);font-size:14px;box-shadow:var(--shadow-lg);transition:transform .3s ease;z-index:2000;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Loading ===== */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:3000;flex-direction:column;gap:16px}
.loading-overlay.active{display:flex}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-secondary);font-size:14px}

/* ===== 响应式 ===== */

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

}

function formatDateFull(s){ const d=s?new Date(s):new Date(); const wk=['日','一','二','三','四','五','六']; return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk[d.getDay()]; }
function formatMoney(n){ return '¥'+parseFloat(n||0).toLocaleString('zh-CN'); }
function relativeDayLabel(s){
  if(!s)return '';
  const d=new Date(s), today=new Date(); d.setHours(0,0,0,0); today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  if(diff===0)return '今天';
  if(diff===1)return '明天';
  if(diff===-1)return '昨天';
  if(diff<0)return '已逾期';
  return '周'+['日','一','二','三','四','五','六'][d.getDay()];
}
function taskDateParts(s){
  const d=new Date(s);
  return {main:(d.getMonth()+1)+'月'+d.getDate()+'日',sub:relativeDayLabel(s)};
}
function greeting(){ const h=new Date().getHours(); if(h<6)return '夜深了'; if(h<11)return '早上好'; if(h<14)return '中午好'; if(h<18)return '下午好'; if(h<22)return '晚上好'; return '夜深了'; }
function isOverdue(t){ if(t.completed)return false; const today=new Date(); today.setHours(0,0,0,0); const dl=new Date(t.deadline); dl.setHours(0,0,0,0); return dl<today; }
function isTodayDeadline(s){ return s===todayStr(); }
function monthKey(s){ return s?s.substring(0,7):''; }
function bytesToSize(bytes){ if(!bytes)return ''; const units=['B','KB','MB','GB']; let n=Number(bytes),i=0; while(n>=1024&&i<units.length-1){n/=1024;i++;} return (i?n.toFixed(1):n.toFixed(0))+units[i]; }
function dailyItems(items){
  const d=new Date(); const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  return items.map((x,i)=>items[(i+seed)%items.length]);
}
function renderRecommendations(items,source){
  return '<div class="recommend-grid">'+items.map((r,idx)=>'<div class="recommend-card">'
    +'<span class="recommend-type">'+(r.type==='视频'?'🎬':'📖')+' '+escapeHtml(r.type)+'</span>'
    +'<div class="recommend-title">'+escapeHtml(r.title)+'</div>'
    +'<div class="recommend-desc">'+escapeHtml(r.desc)+'</div>'
    +'<div class="recommend-actions"><a class="recommend-link" href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener">打开推荐 →</a>'
    +(source?'<button class="fav-btn" data-action="favorite-recommend" data-source="'+source+'" data-index="'+idx+'">♡ 收藏</button>':'')+'</div></div>').join('')+'</div>';
}
function getMonthDays(offset){
  const base=new Date();
  base.setDate(1);
  if(offset) base.setMonth(base.getMonth()+offset);
  const y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const start=new Date(first); start.setDate(1-first.getDay());
  const days=[];
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    days.push({date:ds,day:d.getDate(),currentMonth:d.getMonth()===m,today:ds===todayStr()});
  }
  return {label:y+'年'+(m+1)+'月',days};
}

/* ========== 本地数据回退 ========== */
function ensureDataShape(){
  state.data=state.data||{};
  state.data.tasks=state.data.tasks||[];
  state.data.training=state.data.training||{files:[],courses:[]};
  state.data.training.files=state.data.training.files||[];
  state.data.training.courses=state.data.training.courses||[];
  state.data.students=state.data.students||[];
  state.data.positions=(state.data.positions||[]).map(p=>({...p,jdList:p.jdList||[],prepNotes:p.prepNotes||[],interviewReviews:p.interviewReviews||[]}));
  state.data.income=state.data.income||[];
  state.data.expenses=state.data.expenses||[];
}
function loadDataLocal(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){ state.data=JSON.parse(raw); ensureDataShape(); return; }
  }catch(e){}
  state.data={tasks:[],training:{files:[],courses:[]},students:[],positions:[],income:[],expenses:[]};
}
function saveDataLocal(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data));
    backupToLocalStorage();
  }catch(e){ console.error('本地保存失败:',e); }
}

/* ========== 云端数据本地备份 ========== */
function backupToLocalStorage(){
  try{
    const backupData={
      tasks:state.data.tasks||[],
      training:state.data.training||{files:[],courses:[]},
      students:state.data.students||[],
      positions:state.data.positions||[],
      income:state.data.income||[],
      expenses:state.data.expenses||[],
      lastBackup:new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY_BACKUP,JSON.stringify(backupData));
  }catch(e){ console.error('云端备份到本地失败:',e); }
}

function loadFromBackup(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY_BACKUP);
    if(raw){
      const backup=JSON.parse(raw);
      state.data={
        tasks:backup.tasks||[],
        training:backup.training||{files:[],courses:[]},
        students:backup.students||[],
        positions:backup.positions||[],
        income:backup.income||[],
        expenses:backup.expenses||[]
      };
      ensureDataShape();
      return backup.lastBackup||null;
    }
  }catch(e){ console.error('从备份恢复失败:',e); }
  return null;
}

function getBackupInfo(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY_BACKUP);
    if(!raw) return null;
    const backup=JSON.parse(raw);
    return{
      lastBackup:backup.lastBackup||null,
      taskCount:(backup.tasks||[]).length,
      studentCount:(backup.students||[]).length,
      positionCount:(backup.positions||[]).length,
      incomeCount:(backup.income||[]).length,
      expenseCount:(backup.expenses||[]).length,
      trainingFileCount:(backup.training?.files||[]).length,
      trainingCourseCount:(backup.training?.courses||[]).length
    };
  }catch(e){ return null; }
}

/* ========== 数据导出/导入 ========== */
function exportData(){
  try{
    const exportData={
      tasks:state.data.tasks||[],
      training:state.data.training||{files:[],courses:[]},
      students:state.data.students||[],
      positions:state.data.positions||[],
      income:state.data.income||[],
      expenses:state.data.expenses||[],
      exportDate:new Date().toISOString(),
      version:'1.0'
    };
    const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='工作台数据备份_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('数据已导出 ✓');
  }catch(e){ showToast('导出失败: '+e.message); }
}

function importData(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.tasks&&!imported.students&&!imported.income){
        showToast('文件格式不正确');
        return;
      }
      if(!confirm('导入数据将覆盖当前所有数据，确定继续吗？')){
        return;
      }
      state.data={
        tasks:imported.tasks||[],
        training:imported.training||{files:[],courses:[]},
        students:imported.students||[],
        positions:imported.positions||[],
        income:imported.income||[],
        expenses:imported.expenses||[]
      };
      ensureDataShape();
      saveDataLocal();
      showToast('数据导入成功 ✓');
      navigate('data-mgmt');
      render();
    }catch(err){ showToast('导入失败: '+err.message); }
  };
  reader.readAsText(file);
}

/* ========== Supabase 数据加载 ========== */
async function loadData(options){
  options=options||{};
  const silent=!!options.silent;
  const keepCloudOnError=!!options.keepCloudOnError;
  if(!useCloud){ loadDataLocal(); return; }
  if(!silent) setLoading(true);
  try{
    const [
      {data:tasks,error:e1},{data:trainingFiles,error:e2},{data:trainingCourses,error:e3},
      {data:students,error:e4},{data:studentMaterials,error:e5},
      {data:positions,error:e6},{data:positionItems,error:e7},{data:income,error:e8},{data:expenses,error:e9}
    ]=await Promise.all([
      supabaseClient.from('tasks').select('*'),
      supabaseClient.from('training_files').select('*'),
      supabaseClient.from('training_courses').select('*'),
      supabaseClient.from('students').select('*'),
      supabaseClient.from('student_materials').select('*'),
      supabaseClient.from('positions').select('*'),
      supabaseClient.from('position_items').select('*'),
      supabaseClient.from('income').select('*'),
      supabaseClient.from('expenses').select('*')
    ]);
    const errs=[e1,e2,e3,e4,e5,e6,e7,e8,e9].filter(Boolean);
    if(errs.length>0){ console.error('Supabase errors:',errs); }
    state.data={
      tasks:tasks||[],
      training:{
        files:(trainingFiles||[]).map(f=>({id:f.id,title:f.title,description:f.description,content:f.content,file_name:f.file_name,file_path:f.file_path,file_url:f.file_url,mime_type:f.mime_type,file_size:f.file_size})),
        courses:(trainingCourses||[]).map(c=>({id:c.id,title:c.title,url:c.url,description:c.description}))
      },
      students:(students||[]).map(s=>({
        id:s.id,name:s.name,grade:s.grade,subject:s.subject,
        materials:(studentMaterials||[]).filter(m=>m.student_id===s.id&&m.type==='materials').map(m=>({id:m.id,title:m.title,content:m.content,file_name:m.file_name,file_path:m.file_path,file_url:m.file_url,mime_type:m.mime_type,file_size:m.file_size})),
        lectures:(studentMaterials||[]).filter(m=>m.student_id===s.id&&m.type==='lectures').map(m=>({id:m.id,title:m.title,content:m.content,file_name:m.file_name,file_path:m.file_path,file_url:m.file_url,mime_type:m.mime_type,file_size:m.file_size}))
      })),
      positions:(positions||[]).map(p=>({
        id:p.id,name:p.name,company:p.company,
        jdList:(positionItems||[]).filter(i=>i.position_id===p.id&&i.type==='jdList').map(i=>({id:i.id,title:i.title,content:i.content,file_name:i.file_name,file_path:i.file_path,file_url:i.file_url,mime_type:i.mime_type,file_size:i.file_size})),
        prepNotes:(positionItems||[]).filter(i=>i.position_id===p.id&&i.type==='prepNotes').map(i=>({id:i.id,title:i.title,content:i.content,file_name:i.file_name,file_path:i.file_path,file_url:i.file_url,mime_type:i.mime_type,file_size:i.file_size})),
        interviewReviews:(positionItems||[]).filter(i=>i.position_id===p.id&&i.type==='interviewReviews').map(i=>({id:i.id,title:i.title,content:i.content}))
      })),
      income:(income||[]).map(i=>({id:i.id,date:i.date,time:i.time,amount:i.amount,hours:i.hours,note:i.note})),
      expenses:(expenses||[]).map(i=>({id:i.id,date:i.date,time:i.time,amount:i.amount,category:i.category,note:i.note}))
    };
    backupToLocalStorage();
  }catch(err){
    console.error('Load error:',err);
    if(keepCloudOnError){
      setConnStatus('云同步重试中','#f59e0b');
      if(!silent) showToast('同步失败，已使用本地备份');
      const lastBackup=loadFromBackup();
      if(!lastBackup) loadDataLocal();
    }else{
      showToast('数据加载失败，已切换本地模式');
      useCloud=false;
      setConnStatus('本地模式','#f59e0b');
      const lastBackup=loadFromBackup();
      if(!lastBackup) loadDataLocal();
    }
  }finally{
    if(!silent) setLoading(false);
  }
}

  return;
  if(!useCloud) return;
  try{
    const {data}=await supabaseClient.from('tasks').select('id').limit(1);
    if(data&&data.length>0) return;
    await supabaseClient.from('tasks').insert(SAMPLE_DATA.tasks);
    await supabaseClient.from('training_files').insert(SAMPLE_DATA.trainingFiles);
    await supabaseClient.from('training_courses').insert(SAMPLE_DATA.trainingCourses);
    await supabaseClient.from('students').insert(SAMPLE_DATA.students);
    await supabaseClient.from('positions').insert(SAMPLE_DATA.positions);
    await supabaseClient.from('income').insert(SAMPLE_DATA.income);
  }catch(err){ console.error('Seed error:',err); }
}

function startCloudAutoSync(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=setInterval(async()=>{
    if(!useCloud||modalCtx||state.loading) return;
    await loadData({silent:true,keepCloudOnError:true});
    render();
  },15000);
}

async function syncWhenVisible(){
  if(!useCloud||modalCtx||state.loading) return;
  await loadData({silent:true,keepCloudOnError:true});
  render();
}

/* ========== 初始化 ========== */
async function init(){
  try{
    supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {error}=await supabaseClient.from('tasks').select('id').limit(1);
    if(error&&error.code!=='PGRST116'){ throw error; }
    useCloud=true;
    setConnStatus('云同步已连接','#10b981');
    await seedIfEmpty();
    await loadData();
    startCloudAutoSync();
  }catch(err){
    console.error('Supabase 连接失败，回退本地模式:',err);
    useCloud=false;
    const lastBackup=loadFromBackup();
    if(lastBackup){
      setConnStatus('本地备份模式 (云连接失败)','#f59e0b');
      showToast('已从本地备份恢复数据');
    }else{
      setConnStatus('本地模式 (云连接失败)','#f59e0b');
      loadDataLocal();
    }
  }
  render();
}

document.addEventListener('visibilitychange',function(){
  if(!document.hidden) syncWhenVisible();
});
window.addEventListener('focus',syncWhenVisible);

/* ========== 导航 ========== */
function navigate(view,subView,id){
  state.view=view; state.subView=subView||null; state.selectedId=id||null; state.filter='all';
  render();
}
function updateSidebar(){
  document.querySelectorAll('.menu-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.view===state.view);
  });
  const pending=(state.data?.tasks||[]).filter(t=>!t.completed).length;
  document.getElementById('badge-today').textContent=pending;
  document.getElementById('badge-students').textContent=(state.data?.students||[]).length;
  const monthTotal=(state.data?.income||[]).filter(i=>monthKey(i.date)===monthKey(todayStr())).reduce((s,i)=>s+parseFloat(i.amount),0);
  document.getElementById('badge-income').textContent=monthTotal>0?formatMoney(monthTotal):'0';
  const monthExpense=(state.data?.expenses||[]).filter(i=>monthKey(i.date)===monthKey(todayStr())).reduce((s,i)=>s+parseFloat(i.amount),0);
  document.getElementById('badge-expenses').textContent=monthExpense>0?formatMoney(monthExpense):'0';

/* ========== 主渲染 ========== */
function render(){
  if(state.loading&&!state.data){ document.getElementById('viewContainer').innerHTML='<div class="view"><div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div></div>'; return; }
  const c=document.getElementById('viewContainer');
  let html='';
  switch(state.view){
    case 'today': html=renderToday(); break;
    case 'training': html=renderTraining(); break;
    case 'students': html=state.subView==='detail'?renderStudentDetail(state.selectedId):renderStudents(); break;
    case 'optimization': html=state.subView==='detail'?renderPositionDetail(state.selectedId):renderOptimization(); break;
    case 'income': html=renderIncome(); break;
    case 'expenses': html=renderExpenses(); break;
    case 'data-mgmt': html=renderDataManagement(); break;
  }
  c.innerHTML='<div class="view">'+html+'</div>';
  updateSidebar();
}

/* ========== 今日计划 ========== */
function renderToday(){
  const tasks=state.data?.tasks||[];
  let filtered=state.filter==='all'?tasks:tasks.filter(t=>t.category===state.filter);
  filtered=[...filtered].sort((a,b)=>{ if(a.completed!==b.completed)return a.completed?1:-1; return new Date(a.deadline)-new Date(b.deadline); });
  const todayCount=tasks.filter(t=>isTodayDeadline(t.deadline)&&!t.completed).length;
  const completedCount=tasks.filter(t=>t.completed).length;
  const overdueCount=tasks.filter(t=>isOverdue(t)).length;
  const pendingCount=tasks.filter(t=>!t.completed).length;

  let taskHTML='';
  if(filtered.length===0){
    taskHTML='<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">暂无任务，点击右上角添加吧！</div></div>';
  }else{
    taskHTML='<div class="task-list">'+filtered.map(t=>{
      const overdue=isOverdue(t); const todayDl=isTodayDeadline(t.deadline);
      const cls=t.completed?'completed':overdue?'overdue':todayDl?'today-task':'upcoming';
      const dateParts=taskDateParts(t.deadline);
      const catBadge=CATEGORY_COLORS[t.category]||'badge-blue';
      const deadlineLabel=t.completed?'已完成':dateParts.sub;
      const deadlineCls=t.completed?'completed-text':overdue?'overdue-text':todayDl?'today-text':'';

/* ========== 收入 ========== */
function renderIncome(){
  const income=state.data?.income||[];
  const total=income.reduce((s,i)=>s+parseFloat(i.amount),0);
  const monthTotal=income.filter(i=>monthKey(i.date)===monthKey(todayStr())).reduce((s,i)=>s+parseFloat(i.amount),0);
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayTotal=income.filter(x=>x.date===ds).reduce((s,x)=>s+parseFloat(x.amount),0);
    days.push({date:ds,label:(d.getMonth()+1)+'/'+d.getDate(),amount:dayTotal});
  }
  const maxDay=Math.max(...days.map(d=>d.amount),1);
  const chartHTML='<div class="chart-bars">'+days.map(d=>{
    const h=Math.round(d.amount/maxDay*100);
    return '<div class="chart-bar" title="'+d.date+'"><div class="chart-bar-val">'+(d.amount>0?formatMoney(d.amount):'')+'</div>'
      +'<div class="chart-bar-fill" style="height:'+h+'%"></div><div class="chart-bar-label">'+d.label+'</div></div>';
  }).join('')+'</div>';

  let tableHTML='';
  if(income.length===0){
    tableHTML='<div class="empty"><div class="empty-icon">💰</div><div class="empty-text">暂无收入记录</div></div>';
  }else{
    const sorted=[...income].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    tableHTML='<div class="table-wrap"><table><thead><tr><th>日期</th><th>时间</th><th>金额</th><th>课时</th><th>备注</th><th>操作</th></tr></thead><tbody>'
      +sorted.map(i=>{
        return '<tr><td data-label="日期">'+escapeHtml(i.date)+'</td><td data-label="时间">'+escapeHtml(i.time)+'</td>'
          +'<td data-label="金额" class="amount col-amount">'+formatMoney(i.amount)+'</td>'
          +'<td data-label="课时">'+escapeHtml(i.hours||'')+'</td>'
          +'<td data-label="备注" class="col-note">'+escapeHtml(i.note||'')+'</td>'
          +'<td data-label="" class="col-actions"><button class="icon-btn" data-action="edit-income" data-id="'+i.id+'">✏️</button> <button class="icon-btn danger" data-action="delete-income" data-id="'+i.id+'">🗑</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }

  return '<div class="page-head"><div><h1>💰 收入记录</h1><div class="subtitle">记录每一笔收入</div></div>'
    +'<button class="btn btn-primary" data-action="add-income">+ 记录收入</button></div>'
    +'<div class="income-summary">'
    +'<div class="stat-card"><div class="stat-icon bg-green">💰</div><div class="stat-info"><div class="stat-val">'+formatMoney(total)+'</div><div class="stat-label">总收入</div></div></div>'
    +'<div class="stat-card"><div class="stat-icon bg-blue">📅</div><div class="stat-info"><div class="stat-val">'+formatMoney(monthTotal)+'</div><div class="stat-label">本月收入</div></div></div>'
    +'<div class="stat-card"><div class="stat-icon bg-orange">📊</div><div class="stat-info"><div class="stat-val">'+income.length+'</div><div class="stat-label">记录笔数</div></div></div>'
    +'</div>'+renderIncomeCalendar()+'<div class="income-chart-box"><h3>近7天收入趋势</h3>'+chartHTML+'</div>'+tableHTML;
}

  const expenses=state.data?.expenses||[];

  const total=expenses.reduce((s,i)=>s+parseFloat(i.amount),0);
  const monthTotal=expenses.filter(i=>monthKey(i.date)===monthKey(todayStr())).reduce((s,i)=>s+parseFloat(i.amount),0);
  const monthIncome=income.filter(i=>monthKey(i.date)===monthKey(todayStr())).reduce((s,i)=>s+parseFloat(i.amount),0);
  const balance=monthIncome-monthTotal;
  const quickCats=[
    ['餐饮','🍔'],['交通','🚗'],['购物','🛍️'],['医疗','💊'],
    ['工作','💼'],['补品','🩸'],['运动','🏃'],['书籍','📖']
  ];
  const quickHTML='<div class="quick-grid">'+quickCats.map(([name,icon])=>
    '<div class="quick-item" data-action="quick-expense" data-category="'+name+'"><div class="quick-icon">'+icon+'</div><div class="quick-name">'+name+'</div></div>'
  ).join('')+'</div>';
  let tableHTML='';
  if(expenses.length===0){
    tableHTML='<div class="empty"><div class="empty-icon">🧾</div><div class="empty-text">暂无支出记录</div></div>';
  }else{
    const sorted=[...expenses].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    tableHTML='<div class="table-wrap"><table><thead><tr><th>日期</th><th>时间</th><th>金额</th><th>分类</th><th>备注</th><th>操作</th></tr></thead><tbody>'

      +'</tbody></table></div>';
  }
  return '<div class="page-head"><div><h1>🧾 支出</h1><div class="subtitle">账本首页 · 收入支出同步统计</div></div></div>'
    +'<div class="balance-card"><div class="balance-label">本月结余</div><div class="balance-val">'+formatMoney(balance)+'</div>'
    +'<div class="balance-row"><div><div class="balance-mini-label">收入</div><div class="balance-mini-val">'+formatMoney(monthIncome)+'</div></div>'
    +'<div><div class="balance-mini-label">支出</div><div class="balance-mini-val">'+formatMoney(monthTotal)+'</div></div></div></div>'
    +'<div class="budget-card"><div class="budget-head"><span>🐽 本月预算</span><span class="budget-unset">未设置预算</span></div><div class="budget-bar"><div class="budget-used"></div></div><div class="card-meta">已用 '+formatMoney(monthTotal)+'</div></div>'
    +'<div class="money-actions"><button class="money-action expense" data-action="add-expense">－ 记支出</button><button class="money-action income" data-action="add-income">＋ 记收入</button></div>'
    +renderExpenseCalendar()
    +'<div class="section"><div class="section-head"><h2>📝 快捷分类</h2></div>'+quickHTML+'</div>'
    +'<div class="section"><div class="section-head"><h2>支出明细</h2><span class="kitty-chip">总支出 '+formatMoney(total)+' · '+expenses.length+' 笔</span></div>'+tableHTML+'</div>';

function normalizeUploadFileName(name){
  return (name||'file')
    .normalize('NFKC')
    .replace(/[^\w.\-\u4e00-\u9fa5]/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_+|_+$/g,'') || 'file';
}

function makeUploadPath(prefix,file){
  const safeName=normalizeUploadFileName(file.name);
  const stamp=new Date().toISOString().replace(/[:.]/g,'-');
  const rand=Math.random().toString(16).slice(2);
  return prefix.replace(/^\/+|\/+$/g,'')+'/'+stamp+'-'+rand+'-'+safeName;
}

function readableUploadError(err,bucket){
  const msg=(err&&(err.message||err.error||err.statusText))?String(err.message||err.error||err.statusText):String(err||'未知错误');
  const status=err&&err.status?('状态码 '+err.status+'，'):'';
  if(/bucket|not found|404/i.test(msg)) return bucket+' 云存储桶不存在，请在 Supabase 里执行最新初始化 SQL';
  if(/row-level security|policy|permission|unauthorized|forbidden|403|jwt/i.test(msg)) return bucket+' 云存储权限未放开，请检查 Storage policy';
  if(/payload|size|too large|413/i.test(msg)) return '文件过大，当前线上环境拒绝上传';
  return bucket+' 上传失败：'+status+msg;
}

async function uploadFileToCloud(file,options){
  const attempts=[
    {bucket:options.primaryBucket,prefix:options.primaryPrefix},
    {bucket:options.fallbackBucket,prefix:options.fallbackPrefix}
  ].filter((item,index,arr)=>item.bucket&&item.prefix&&arr.findIndex(x=>x.bucket===item.bucket&&x.prefix===item.prefix)===index);
  const errors=[];

  for(const attempt of attempts){
    const path=makeUploadPath(attempt.prefix,file);
    const {error}=await supabaseClient.storage
      .from(attempt.bucket)
      .upload(path,file,{
        upsert:true,
        cacheControl:'3600',
        contentType:file.type||'application/octet-stream'
      });
    if(!error){
      const {data:urlData}=supabaseClient.storage.from(attempt.bucket).getPublicUrl(path);
      return {bucket:attempt.bucket,path,publicUrl:urlData.publicUrl};
    }
    errors.push(readableUploadError(error,attempt.bucket));
  }

  throw new Error(errors.join('；'));
}

/* ========== 语音口述 ========== */
let voiceRecognition=null;
let voiceTarget='';
function toggleVoiceDictation(targetName){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showToast('当前浏览器不支持语音识别'); return; }
  if(voiceRecognition&&voiceRecognition.isRecognizing){
    voiceRecognition.stop();
    voiceRecognition.isRecognizing=false;
    return;
  }
  voiceRecognition=new SR();
  voiceRecognition.lang='zh-CN';
  voiceRecognition.continuous=true;
  voiceRecognition.interimResults=true;
  voiceTarget=targetName;
  const textarea=document.querySelector('#modalForm textarea[name="'+targetName+'"]');
  if(!textarea) return;
  const btn=document.querySelector('[data-action="voice-dictate"][data-target="'+targetName+'"]');
  const baseText=textarea.value;
  voiceRecognition.onresult=function(e){
    let interim='';
    let finalText=baseText;
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){ finalText+=e.results[i][0].transcript; }
      else{ interim+=e.results[i][0].transcript; }
    }
    textarea.value=finalText+interim;
  };
  voiceRecognition.onerror=function(e){
    showToast('语音识别出错: '+e.error);
    if(btn){ btn.textContent='🎤 口述'; btn.classList.remove('recording'); }
    voiceRecognition.isRecognizing=false;
  };
  voiceRecognition.onend=function(){
    if(btn){ btn.textContent='🎤 口述'; btn.classList.remove('recording'); }
    voiceRecognition.isRecognizing=false;
  };
  voiceRecognition.start();
  voiceRecognition.isRecognizing=true;
  if(btn){ btn.textContent='⏹ 停止'; btn.classList.add('recording'); }
}

/* ========== 表单提交 ========== */
async function submitForm(){
  const form=document.getElementById('modalForm');
  if(!form||!form.reportValidity()) return;
  const fd=new FormData(form);
  const data={};
  for(let [k,v] of fd.entries()){ if(k!=='files') data[k]=v; }
  const {type,mode,id,parent}=modalCtx;
  let error=null;

  if(type==='upload-materials'){
    await uploadStudentFiles(parent,data.content||'');
    return;
  }
  if(type==='upload-training-file'){
    await uploadTrainingFiles(data);
    return;
  }
  if(type==='upload-position-item'){
    await uploadPositionItemFiles(parent,data);
    return;
  }

  // 面试复盘：组合内容
  if(type==='interview-review'){
    const reviewData={
      title:data.title,
      content:JSON.stringify({
        questions:data.questions||'',
        answer:data.answer||'',
        improvement:data.improvement||''
      })
    };
    if(!useCloud){
      const p=state.data.positions.find(x=>x.id===parent.positionId);
      if(p){
        if(!p.interviewReviews) p.interviewReviews=[];
        if(mode==='add'){ p.interviewReviews.push({id:Date.now().toString(),...reviewData}); }
        else { const item=p.interviewReviews.find(i=>i.id===id); if(item) Object.assign(item,reviewData); }
      }
      saveDataLocal();
      closeModal(); render(); showToast(mode==='add'?'添加成功 ✓':'更新成功 ✓');
      return;
    }
    if(mode==='add'){
      const {error:e}=await supabaseClient.from('position_items').insert({
        position_id:parent.positionId,
        title:reviewData.title,
        content:reviewData.content,
        type:'interviewReviews'
      });
      error=e;
    }else{
      const {error:e}=await supabaseClient.from('position_items').update({
        title:reviewData.title,
        content:reviewData.content
      }).eq('id',id);
      error=e;
    }
    if(error){ showToast('保存失败: '+error.message); return; }
    await loadData();
    closeModal(); render();
    showToast(mode==='add'?'添加成功 ✓':'更新成功 ✓');
    return;
  }

  if(!useCloud){
    // 本地模式
    switch(type){
      case 'task':
        if(mode==='add') state.data.tasks.push({id:Date.now().toString(),...data,completed:false});
        else Object.assign(state.data.tasks.find(t=>t.id===id)||{},data);
        break;
      case 'file':
        if(mode==='add') state.data.training.files.push({id:Date.now().toString(),...data});
        else Object.assign(state.data.training.files.find(f=>f.id===id)||{},data);
        break;
      case 'course': state.data.training.courses.push({id:Date.now().toString(),...data}); break;
      case 'student': state.data.students.push({id:Date.now().toString(),...data,materials:[],lectures:[]}); break;
      case 'material':
        if(mode==='add'){ const s=state.data.students.find(x=>x.id===parent.studentId); if(s) s[parent.type].push({id:Date.now().toString(),...data}); }
        else { const s=state.data.students.find(x=>x.id===parent.studentId); if(s){ const item=s[parent.type].find(i=>i.id===id); if(item) Object.assign(item,data); } }
        break;
      case 'position': state.data.positions.push({id:Date.now().toString(),...data,jdList:[],prepNotes:[],interviewReviews:[]}); break;
      case 'position-item':
        if(mode==='add'){ const p=state.data.positions.find(x=>x.id===parent.positionId); if(p) p[parent.type].push({id:Date.now().toString(),...data}); }
        else { const p=state.data.positions.find(x=>x.id===parent.positionId); if(p){ const item=p[parent.type].find(i=>i.id===id); if(item) Object.assign(item,data); } }
        break;
      case 'income':
        if(mode==='add') state.data.income.push({id:Date.now().toString(),...data});
        else Object.assign(state.data.income.find(i=>i.id===id)||{},data);
        break;
      case 'expense':
        if(mode==='add') state.data.expenses.push({id:Date.now().toString(),...data});
        else Object.assign(state.data.expenses.find(i=>i.id===id)||{},data);
        break;
    }
    saveDataLocal();
    closeModal(); render(); showToast(mode==='add'?'添加成功 ✓':'更新成功 ✓');
    return;
  }

  // 云同步模式
  switch(type){
    case 'task':
      if(mode==='add'){ const {error:e}=await supabaseClient.from('tasks').insert({...data,completed:false}); error=e; }
      else { const {error:e}=await supabaseClient.from('tasks').update(data).eq('id',id); error=e; }
      break;
    case 'file':
      if(mode==='add'){ const {error:e}=await supabaseClient.from('training_files').insert(data); error=e; }
      else { const {error:e}=await supabaseClient.from('training_files').update(data).eq('id',id); error=e; }
      break;
    case 'course': { const {error:e}=await supabaseClient.from('training_courses').insert(data); error=e; break; }
    case 'student': { const {error:e}=await supabaseClient.from('students').insert(data); error=e; break; }
    case 'material':
      if(mode==='add'){ const {error:e}=await supabaseClient.from('student_materials').insert({student_id:parent.studentId,...data,type:parent.type}); error=e; }
      else { const {error:e}=await supabaseClient.from('student_materials').update({title:data.title,content:data.content}).eq('id',id); error=e; }
      break;
    case 'position': { const {error:e}=await supabaseClient.from('positions').insert(data); error=e; break; }
    case 'position-item':
      if(mode==='add'){ const {error:e}=await supabaseClient.from('position_items').insert({position_id:parent.positionId,...data,type:parent.type}); error=e; }
      else { const {error:e}=await supabaseClient.from('position_items').update({title:data.title,content:data.content}).eq('id',id); error=e; }
      break;
    case 'income':
      if(mode==='add'){ const {error:e}=await supabaseClient.from('income').insert({...data,amount:parseFloat(data.amount)}); error=e; }
      else { const {error:e}=await supabaseClient.from('income').update({...data,amount:parseFloat(data.amount)}).eq('id',id); error=e; }
      break;
    case 'expense':
      if(mode==='add'){ const {error:e}=await supabaseClient.from('expenses').insert({...data,amount:parseFloat(data.amount)}); error=e; }
      else { const {error:e}=await supabaseClient.from('expenses').update({...data,amount:parseFloat(data.amount)}).eq('id',id); error=e; }
      break;
  }

  if(error){ showToast('保存失败: '+error.message); return; }
  await loadData();
  closeModal(); render();
  showToast(mode==='add'?'添加成功 ✓':'更新成功 ✓');
}

  html+='<button class="btn btn-secondary" data-action="sync-now">🔄 立即同步云端</button>';
  html+='</div>';
  html+='<div class="dm-tip">💡 云端同步让你在电脑和手机上看到相同的数据。即使关掉电脑，手机仍然可以独立使用（使用本地备份），下次联网后自动同步。</div>';
  html+='</div>';

  return html;
}

/* ========== 事件委托 ========== */
document.addEventListener('click',async function(e){
  const delCourse=e.target.closest('[data-action="delete-course"]');
  if(delCourse){ e.preventDefault(); if(confirm('确定删除此课程链接？')) await deleteCourse(delCourse.dataset.id); return; }

  const target=e.target.closest('[data-action]');
  if(!target) return;
  const a=target.dataset.action;
  const d=target.dataset;

  switch(a){
    case 'navigate': navigate(d.view,d.subview,d.id); break;
    case 'filter': state.filter=d.filter; render(); break;
    case 'close-modal': closeModal(); break;
    case 'submit-form': await submitForm(); break;
    case 'view-task-date': openTaskDateModal(d.date); break;
    case 'view-income-date': openIncomeDateModal(d.date); break;
    case 'view-expense-date': openExpenseDateModal(d.date); break;
    case 'favorite-recommend': await favoriteRecommend(d.source,d.index); break;
    case 'cal-task-prev': state.calOffsetTask--; render(); break;
    case 'cal-task-next': state.calOffsetTask++; render(); break;
    case 'cal-task-reset': state.calOffsetTask=0; render(); break;
    case 'cal-income-prev': state.calOffsetIncome--; render(); break;
    case 'cal-income-next': state.calOffsetIncome++; render(); break;
    case 'cal-income-reset': state.calOffsetIncome=0; render(); break;
    case 'cal-expense-prev': state.calOffsetExpense--; render(); break;
    case 'cal-expense-next': state.calOffsetExpense++; render(); break;
    case 'cal-expense-reset': state.calOffsetExpense=0; render(); break;

    case 'add-task': openFormModal('task','add'); break;
    case 'edit-task': { const t=(state.data?.tasks||[]).find(x=>x.id===d.id); if(t) openFormModal('task','edit',t); break; }
    case 'toggle-task': await toggleTask(d.id); break;
    case 'delete-task': if(confirm('确定删除此任务？')) await deleteTask(d.id); break;

    case 'add-file': openFormModal('file','add'); break;
    case 'upload-training-file': openTrainingUploadModal(); break;
    case 'view-file': { const f=(state.data?.training?.files||[]).find(x=>x.id===d.id); if(f) openViewModal('file',f); break; }
    case 'delete-file': if(confirm('确定删除此文件？')) await deleteFile(d.id); break;

    case 'add-course': openFormModal('course','add'); break;

    case 'add-student': openFormModal('student','add'); break;
    case 'view-student': navigate('students','detail',d.id); break;
    case 'delete-student': if(confirm('确定删除此学生及其所有资料？')) await deleteStudent(d.id); break;

    case 'add-material': openFormModal('material','add',null,{studentId:d.studentId,type:d.type}); break;
    case 'upload-materials': openUploadModal(d.studentId,d.type); break;
    case 'view-material': { const s=(state.data?.students||[]).find(x=>x.id===d.studentId); if(s){ const item=s[d.type].find(i=>i.id===d.itemId); if(item) openViewModal('material',item,{studentId:d.studentId,type:d.type}); } break; }
    case 'delete-material': if(confirm('确定删除？')) await deleteMaterial(d.studentId,d.type,d.itemId); break;

    case 'add-position': openFormModal('position','add'); break;
    case 'view-position': navigate('optimization','detail',d.id); break;
    case 'delete-position': if(confirm('确定删除此岗位及其所有资料？')) await deletePosition(d.id); break;

    case 'add-position-item': openFormModal('position-item','add',null,{positionId:d.positionId,type:d.type}); break;
    case 'upload-position-item': openPositionItemUploadModal(d.positionId,d.type); break;
    case 'add-interview-review': openInterviewReviewModal(d.positionId,'add'); break;
    case 'view-position-item': { const p=(state.data?.positions||[]).find(x=>x.id===d.positionId); if(p){ const item=p[d.type].find(i=>i.id===d.itemId); if(item) openViewModal('position-item',item,{positionId:d.positionId,type:d.type}); } break; }
    case 'delete-position-item': if(confirm('确定删除？')) await deletePositionItem(d.positionId,d.type,d.itemId); break;
    case 'voice-dictate': e.preventDefault(); toggleVoiceDictation(d.target); break;

    case 'add-income': openFormModal('income','add'); break;
    case 'edit-income': { const i=(state.data?.income||[]).find(x=>x.id===d.id); if(i) openFormModal('income','edit',i); break; }
    case 'delete-income': if(confirm('确定删除此记录？')) await deleteIncome(d.id); break;

    case 'add-expense': openFormModal('expense','add'); break;
    case 'quick-expense': openFormModal('expense','add',{category:d.category}); break;
    case 'edit-expense': { const i=(state.data?.expenses||[]).find(x=>x.id===d.id); if(i) openFormModal('expense','edit',i); break; }
    case 'delete-expense': if(confirm('确定删除此支出？')) await deleteExpense(d.id); break;

    case 'backup-now': backupToLocalStorage(); showToast('已备份到本地 ✓'); render(); break;
    case 'restore-from-backup': {
      const lastBackup=loadFromBackup();
      if(lastBackup){
        const d2=new Date(lastBackup);
        showToast('已从本地备份恢复 ('+d2.toLocaleString('zh-CN')+')');
        render();
      }else{
        showToast('暂无本地备份数据');
      }
      break;
    }
    case 'export-data': exportData(); break;
    case 'import-data-trigger': document.getElementById('importFileInput').click(); break;
    case 'sync-now': {
      if(!useCloud){ showToast('当前为本地模式，无法同步云端'); break; }
      showToast('正在同步...');
      await loadData({keepCloudOnError:true});
      render();
      showToast('同步完成 ✓');
      break;
    }

    case 'edit-from-view': {
      const ctx=modalCtx;
      closeModal();
      if(ctx.parent&&ctx.parent.type==='interviewReviews'){
        let parsed={questions:'',answer:'',improvement:''};
        try{ parsed=JSON.parse(ctx.item.content||'{}'); }catch(e){}
        openInterviewReviewModal(ctx.parent.positionId,'edit',{id:ctx.item.id,title:ctx.item.title,questions:parsed.questions,answer:parsed.answer,improvement:parsed.improvement});
      }else{
        openFormModal(ctx.type,'edit',ctx.item,ctx.parent);
      }
      break;
    }
    case 'delete-from-view': {
      if(!confirm('确定删除？')) break;
      const {type,item,parent}=modalCtx;
      closeModal();
      switch(type){
        case 'file': await deleteFile(item.id); break;
        case 'material': await deleteMaterial(parent.studentId,parent.type,item.id); break;
        case 'position-item': await deletePositionItem(parent.positionId,parent.type,item.id); break;
      }
      break;
    }
  }
});

// 点击遮罩关闭弹窗
document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

// ESC关闭弹窗
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeModal();
});

// 文件导入监听
document.addEventListener('change',function(e){
  if(e.target.id==='importFileInput'&&e.target.files.length>0){
    importData(e.target.files[0]);
    e.target.value='';
  }
});

/* ========== 启动 ========== */
init();
</script>
</body>
</html>
